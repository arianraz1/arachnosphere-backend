# ==============================================================
#  Production Profile Configuration
# ==============================================================
# This file overrides application.properties when SPRING_PROFILES_ACTIVE=prod

# ==============================================================
#  Database
# ==============================================================
# Production database URL should be set via environment variable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tarantula_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Validate schema against entities on startup
spring.jpa.hibernate.ddl-auto=validate

# Disable open-in-view to avoid lazy loading issues and improve performance
spring.jpa.open-in-view=false

# ==============================================================
#  Flyway
# ==============================================================
spring.flyway.enabled=true

# ==============================================================
#  JWT
# ==============================================================
# Production: JWT_SECRET must be set via environment variable
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

# ==============================================================
#  Cookie settings
# ==============================================================
# Production: cookies must be secure and use the actual domain
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.domain=${COOKIE_DOMAIN}
app.cookie.access-token-name=access_token
app.cookie.refresh-token-name=refresh_token

# ==============================================================
#  CORS
# ==============================================================
# Production: set CORS_ALLOWED_ORIGIN to your actual frontend domain
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Disable default static resource mappings
spring.web.resources.add-mappings=false

# ==============================================================
#  Admin
# ==============================================================
app.admin.user-id=${ADMIN_USER_ID:1}

# ==============================================================
#  Resend (Email)
# ==============================================================
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:noreply@arachnosphere.com}
resend.from.name=${RESEND_FROM_NAME:Arachnosphere}

# ==============================================================
#  Base URL
# ==============================================================
app.base-url=${APP_BASE_URL}

# ==============================================================
#  Logging
# ==============================================================
# Production logging configuration
logging.level.root=INFO
logging.level.com.tarantulacommunity.tarantulasocial=INFO

# Silence intentional Spring Security warning
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ==============================================================
#  Rate Limiting
# ==============================================================
rate-limit.login.capacity=10
rate-limit.login.refill-period=15m

rate-limit.register.capacity=3
rate-limit.register.refill-period=1h

rate-limit.forgot-password.capacity=5
rate-limit.forgot-password.refill-period=1h

rate-limit.reset-password.capacity=10
rate-limit.reset-password.refill-period=1h

rate-limit.refresh.capacity=15
rate-limit.refresh.refill-period=1h

rate-limit.message-send.capacity=8
rate-limit.message-send.refill-period=1m

rate-limit.collection-write.capacity=20
rate-limit.collection-write.refill-period=1m

rate-limit.profile-update.capacity=8
rate-limit.profile-update.refill-period=1m

rate-limit.image-upload.capacity=5
rate-limit.image-upload.refill-period=1m

rate-limit.admin-species-sync.capacity=5
rate-limit.admin-species-sync.refill-period=5m

rate-limit.resend-verification.capacity=5
rate-limit.resend-verification.refill-period=1h

rate-limit.csrf.capacity=20
rate-limit.csrf.refill-period=1m

rate-limit.verify-email.capacity=5
rate-limit.verify-email.refill-period=1h

rate-limit.thread-creation.capacity=18
rate-limit.thread-creation.refill-period=1h

rate-limit.default-limit.capacity=150
rate-limit.default-limit.refill-period=1m

# ==============================================================
#  Actuator (Health & Metrics) - Production
# ==============================================================
# Enable health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Show detailed health information only when authorized
management.endpoint.health.show-details=when-authorized

# Enable all health indicators
management.health.defaults.enabled=true

# Custom application info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Enable Prometheus metrics endpoint for monitoring systems
management.endpoint.prometheus.enabled=true

# ==============================================================
#  Database Connection Pooling (HikariCP) - Production
# ==============================================================
# Maximum pool size (adjust based on your database and application load)
spring.datasource.hikari.maximum-pool-size=20

# Minimum idle connections
spring.datasource.hikari.minimum-idle=5

# Connection timeout (milliseconds)
spring.datasource.hikari.connection-timeout=30000

# Maximum lifetime of a connection in the pool (milliseconds) - 30 minutes
spring.datasource.hikari.max-lifetime=1800000

# Idle timeout for connections (milliseconds) - 10 minutes
spring.datasource.hikari.idle-timeout=600000

# ==============================================================
#  Graceful Shutdown - Production
# ==============================================================
# Enable graceful shutdown
server.shutdown=graceful

# Grace period for in-flight requests (seconds)
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==============================================================
#  Cache Configuration (Caffeine) - Production
# ==============================================================
# Rate limit cache - IP-based
cache.ip-rate-limit.maximum-size=10000
cache.ip-rate-limit.expire-after-write=1h

# Rate limit cache - User-based
cache.user-rate-limit.maximum-size=10000
cache.user-rate-limit.expire-after-write=1h


# ==============================================================
#  S3 Configuration
# ==============================================================
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.endpoint-url=${AWS_S3_ENDPOINT_URL}
aws.s3.public-endpoint-url=${AWS_S3_PUBLIC_ENDPOINT_URL}
aws.s3.access-key-id=${AWS_S3_ACCESS_KEY_ID}
aws.s3.secret-access-key=${AWS_S3_SECRET_ACCESS_KEY}
aws.s3.public-url-includes-bucket=${AWS_S3_PUBLIC_URL_INCLUDES_BUCKET}

# ==============================================================
#  File Upload Tomcat Limit Change
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB