# ==============================================================
#  Application
# ==============================================================
spring.application.name=tarantula-project

# ==============================================================
#  Database
# ==============================================================
#  Production: set DB_PASSWORD environment variable
#  Development: falls back to the default password
spring.datasource.url=jdbc:postgresql://localhost:5432/tarantula_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:changemeinprod!}

# Validate schema against entities on startup — never auto-create or drop tables
spring.jpa.hibernate.ddl-auto=validate

# Disable open-in-view to avoid lazy loading issues and improve performance
spring.jpa.open-in-view=false

# ==============================================================
#  Flyway
# ==============================================================
#  Flyway manages all schema migrations — do not use ddl-auto=create
spring.flyway.enabled=true

# ==============================================================
#  JWT
# ==============================================================
#  Production: set JWT_SECRET environment variable
#  Development: the default Base64 string is used automatically
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3JldEtleVRoYXQSXNBdExlYXN0MzJCeXRlc0xvbmdGb3JUZXN0aW5n}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

# ==============================================================
#  Cookie settings
# ==============================================================
#  Production: set COOKIE_SECURE=true and COOKIE_DOMAIN to your domain
#  Development: defaults to localhost with secure=false
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.domain=${COOKIE_DOMAIN:localhost}
app.cookie.access-token-name=access_token
app.cookie.refresh-token-name=refresh_token

# ==============================================================
#  CORS
# ==============================================================
#  Production: set CORS_ALLOWED_ORIGIN to your frontend URL (e.g. https://arachnosphere.com)
#  Development: defaults to http://localhost:3000
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}/api/v1

# Disable default static resource mappings so Spring doesn't try to serve index.html
spring.web.resources.add-mappings=false

# ==============================================================
#  Admin
# ==============================================================
#  The user ID that is granted ROLE_ADMIN — defaults to 1
app.admin.user-id=${ADMIN_USER_ID:1}

# ==============================================================
#  SendGrid (Email)
# ==============================================================
#  Production: set SENDGRID_API_KEY environment variable
#  The from address must match your verified SendGrid sender domain
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@arachnosphere.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Arachnosphere}

# ==============================================================
#  Base URL
# ==============================================================
#  Used to construct email verification links
#  Production: set APP_BASE_URL to your backend URL (e.g. https://api.arachnosphere.com)
#  Development: defaults to localhost
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ==============================================================
#  Logging
# ==============================================================
#  Silence intentional Spring Security warning about manual DaoAuthenticationProvider config
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ==============================================================
#  Rate Limiting
# ==============================================================
rate-limit.login.capacity=10
rate-limit.login.refill-period=15m

rate-limit.register.capacity=3
rate-limit.register.refill-period=1h

rate-limit.forgot-password.capacity=5
rate-limit.forgot-password.refill-period=1h

rate-limit.reset-password.capacity=10
rate-limit.reset-password.refill-period=1h

rate-limit.refresh.capacity=30
rate-limit.refresh.refill-period=1h

rate-limit.message-send.capacity=30
rate-limit.message-send.refill-period=1m

rate-limit.collection-write.capacity=60
rate-limit.collection-write.refill-period=1m

rate-limit.profile-update.capacity=20
rate-limit.profile-update.refill-period=1m

rate-limit.image-upload.capacity=10
rate-limit.image-upload.refill-period=1m

rate-limit.admin-species-sync.capacity=5
rate-limit.admin-species-sync.refill-period=5m

rate-limit.resend-verification.capacity=5
rate-limit.resend-verification.refill-period=1h

rate-limit.csrf.capacity=20
rate-limit.csrf.refill-period=1m

rate-limit.verify-email.capacity=5
rate-limit.verify-email.refill-period=1h

rate-limit.default-limit.capacity=300
rate-limit.default-limit.refill-period=1m

# ==============================================================
#  Actuator (Health & Metrics)
# ==============================================================
# Enable health and info endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health information
management.endpoint.health.show-details=when-authorized

# Enable health indicators
management.health.defaults.enabled=true

# Custom application info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# ==============================================================
#  AWS S3 Configuration
# ==============================================================
# Credentials: NOT set here — resolved via AWS default credential chain
# (env vars / ~/.aws/credentials locally, IAM role in production)
aws.s3.bucket=${AWS_S3_BUCKET:tarantula-images}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.endpoint-url=${AWS_S3_ENDPOINT_URL:http://localhost:4566}