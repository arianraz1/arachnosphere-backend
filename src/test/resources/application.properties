spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

# ==============================================================
#  Test-specific JWT & cookie settings
# ==============================================================
#  Use a hardcoded secret just for testing – never used in prod
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3JldEtleVRoYXQSXNBdExlYXN0MzJCeXRlc0xvbmdGb3JUZXN0aW5n}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

app.cookie.secure=false
app.cookie.domain=localhost
app.cookie.access-token-name=access_token
app.cookie.refresh-token-name=refresh_token

app.cors.allowed-origin=http://localhost:3000

app.admin.user-id=${ADMIN_USER_ID:1}

# ==============================================================
#  Test-specific SendGrid configuration (disabled)
# ==============================================================
sendgrid.api.key=test-api-key
sendgrid.from.email=noreply@test.com
sendgrid.from.name=TestApp
app.base-url=http://localhost:8080

# ==============================================================
#  Test-specific email verification (auto-verify)
# ==============================================================
app.email.verification.required=false
