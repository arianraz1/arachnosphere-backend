# ==============================================================
#  Database (H2 in-memory for tests)
# ==============================================================
#  PostgreSQL compatibility mode ensures Flyway migrations run correctly
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Use H2 dialect for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Validate schema against entities — Flyway creates the schema first
spring.jpa.hibernate.ddl-auto=validate

# Keep SQL logging off to reduce test noise
spring.jpa.show-sql=false

# ==============================================================
#  Flyway
# ==============================================================
#  Flyway runs all migrations against H2 before tests execute
spring.flyway.enabled=true

# ==============================================================
#  JWT
# ==============================================================
#  Hardcoded secret for tests only — never used in production
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3JldEtleVRoYXQSXNBdExlYXN0MzJCeXRlc0xvbmdGb3JUZXN0aW5n}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

# ==============================================================
#  Cookie settings
# ==============================================================
#  Secure=false for HTTP in test environment
app.cookie.secure=false
app.cookie.domain=localhost
app.cookie.access-token-name=access_token
app.cookie.refresh-token-name=refresh_token

# ==============================================================
#  CORS
# ==============================================================
app.cors.allowed-origin=http://localhost:3000

# ==============================================================
#  Admin
# ==============================================================
app.admin.user-id=${ADMIN_USER_ID:1}

# ==============================================================
#  Resend (Email)
# ==============================================================
#  Dummy values for tests — Resend is mocked so no real emails are sent
resend.api.key=test-api-key
resend.from.email=noreply@test.com
resend.from.name=TestApp

# ==============================================================
#  Base URL
# ==============================================================
#  Used to construct verification links in tests
app.base-url=http://localhost:8080

# ==============================================================
#  Email verification
# ==============================================================
#  Disables mandatory email verification during tests
app.email.verification.required=false

# ==============================================================
#  Rate Limiting
# ==============================================================
rate-limit.login.capacity=10
rate-limit.login.refill-period=15m

rate-limit.register.capacity=3
rate-limit.register.refill-period=1h

rate-limit.forgot-password.capacity=5
rate-limit.forgot-password.refill-period=1h

rate-limit.reset-password.capacity=10
rate-limit.reset-password.refill-period=1h

rate-limit.refresh.capacity=15
rate-limit.refresh.refill-period=1h

rate-limit.message-send.capacity=8
rate-limit.message-send.refill-period=1m

rate-limit.collection-write.capacity=20
rate-limit.collection-write.refill-period=1m

rate-limit.profile-update.capacity=8
rate-limit.profile-update.refill-period=1m

rate-limit.image-upload.capacity=5
rate-limit.image-upload.refill-period=1m

rate-limit.admin-species-sync.capacity=5
rate-limit.admin-species-sync.refill-period=5m

rate-limit.resend-verification.capacity=5
rate-limit.resend-verification.refill-period=1h

rate-limit.csrf.capacity=20
rate-limit.csrf.refill-period=1m

rate-limit.verify-email.capacity=5
rate-limit.verify-email.refill-period=1h

rate-limit.thread-creation.capacity=18
rate-limit.thread-creation.refill-period=1h

rate-limit.default-limit.capacity=150
rate-limit.default-limit.refill-period=1m
# ==============================================================
#  Actuator (Health & Metrics)
# ==============================================================
# Enable health and info endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health information
management.endpoint.health.show-details=when-authorized

# Enable health indicators
management.health.defaults.enabled=true

# Custom application info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Disable default static resource mappings
spring.web.resources.add-mappings=false

# ==============================================================
#  Logging
# ==============================================================
#  Silence intentional Spring Security warning about manual DaoAuthenticationProvider config
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ==============================================================
#  AWS S3 Configuration - TEST OVERRIDES
# ==============================================================
# Point to a dedicated test bucket and a local dummy endpoint
aws.s3.bucket=tarantula-images-test
aws.s3.region=us-east-1
aws.s3.endpoint-url=http://localhost:4566

# ==============================================================
#  File Upload Tomcat Limit Change
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB